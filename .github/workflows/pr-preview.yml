name: Deploy PR previews

# TapRig fork: the `deploy-preview` job (GitHub Pages preview on gh-pages) is removed. Only the
# read-only command-docs gate stays. See docs/upstream-sync.md (CI of the fork).

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - 'website/**'
      - '.github/actions/build-docs/action.yml'
      - '.github/actions/setup-node-pnpm/action.yml'
      - '.github/workflows/pr-preview.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

concurrency: preview-${{ github.ref }}

jobs:
  command-docs-gate:
    # ci.yml ignores website/**, so a docs-only PR never triggers the unit lane
    # that carries the command-reference coverage gate
    # (test/repo-guards/command-doc-coverage.test.ts). Run it here — where
    # commands.md changes DO trigger a workflow — so documenting a retired
    # command (or dropping a public command's docs) fails on docs-only PRs too.
    # The gate is read-only and must run on fork docs PRs as well. Coordinates
    # with the #1429 gate manifest.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup toolchain
        uses: ./.github/actions/setup-node-pnpm

      - name: Check command reference doc coverage
        uses: ./.github/actions/run-gate
        with: { gate: command-docs }
