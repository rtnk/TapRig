packages:
  - 'website'
  - 'packages/*'
# Keep non-interactive checks from downloading tooling or reinstalling dependencies implicitly.
pmOnFail: warn
verifyDepsBeforeRun: warn
allowBuilds:
  fallow: true
minimumReleaseAgeExclude:
  - '@chenglou/freerange@0.0.4'
overrides:
  brace-expansion@5: '^5.0.12'
  fast-uri: 3.1.9
  postcss: 8.5.23
  qs@6: ^6.16.0
  react-router: 7.18.2
  react-router-dom: 7.18.2
  # The exact scoped override keeps every undici 7 consumer, including the
  # transitive @ai-sdk/provider-utils range, on the patched 7.30.1 (GHSA-xjj6-f33q-929c).
  # Update the root, maestro, and provision-kit exact pins with this override.
  undici@7: 7.30.1
  zod@4: ^4.6.6
patchedDependencies:
  ast-v8-to-istanbul@1.0.7: patches/ast-v8-to-istanbul@1.0.7.patch
